[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LordPhenixDeNetra/lpdnsoft-libs"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"

[workspace.dependencies]
lpdnsoft-atomic = { path = "crates/atomic", version = "0.1.0" }
lpdnsoft-i18n-catalog = { path = "crates/i18n-catalog", version = "0.1.0" }
lpdnsoft-i18n-macros = { path = "crates/i18n-macros", version = "0.1.0" }
egui = { version = "0.36", default-features = false, features = ["default_fonts"] }
egui_kittest = "0.36"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
fluent-langneg = "0.13"
unic-langid = { version = "0.9", features = ["macros"] }
sys-locale = "0.3"
directories = "6"
toml = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
trybuild = "1"
anyhow = "1"
